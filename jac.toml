[project]
name = "jacos"
version = "0.1.0"
description = "JacOS -- the Linux device tree as a first-class Jac graph"
entry-point = "src/main.jac"
kind = "fullstack"

[dependencies]
byllm = ">=0.4.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]
# Turn this on when a client build fails: it appends a "Raw Error" block with
# the actual Vite/Rollup message, which is how the missing-stylesheet
# resolution error was finally read. Off by default -- it prints a warning
# banner at startup that is noise during a demo.
debug = false

# Browser tab / page <title>. Without this the title falls back to the mount
# function name, which rendered as the unhelpful "app".
[plugins.client.app_meta_data]
title = "jac_OS"
